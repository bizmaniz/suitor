  # Healthcare services / health systems / B2B services targets.
  - name: Cox Enterprises
    careers_url: https://jobs.coxenterprises.com
    scan_method: websearch
    scan_query: 'site:jobs.coxenterprises.com "Director" "Operations" Atlanta'
    notes: "Likely JS-rendered; use browser/liveness checks."
