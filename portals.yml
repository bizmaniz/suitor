# Sample Candidate Portal Scanner Configuration

location_filter:
  allow:
    - "Remote"
    - "United States"
    - "USA"
    - "US"
    - "Atlanta"
    - "Alpharetta"
    - "Georgia"
    - "GA"
  block:
    - "Relocation"
    - "India"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "France"
    - "Singapore"
    - "Australia"
    - "Canada"

title_filter:
  positive:
    - "Director of Operations"
    - "Director, Operations"
    - "Operations Director"
    - "Director of Strategy and Operations"
    - "Director, Strategy and Operations"
    - "Director Strategy & Operations"
    - "Strategic Operations"
    - "Business Operations"
    - "Clinical Operations"
    - "Chief of Staff"
    - "Head of Operations"
    - "Director of Integration"
    - "Head of Integration"
    - "M&A Integration"
    - "Post-Merger Integration"
    - "VP of Operations"
    - "VP Operations"
    - "Operations Integration"
    - "Practice Operations"
    - "Strategic Initiatives"
    - "Operational Excellence"
  negative:
    - "CEO"
    - "Chief Executive Officer"
    - "Founder"
    - "Co-Founder"
    - "Government"
    - "Manufacturing"
    - "Retail Store"
    - "Restaurant"
    - "Franchise"
    - "Field Sales"
    - "Sales Operations"
    - "Customer Success"
    - "Account Manager"
    - "Manager,"
    - "Operations Manager"
    - "Supervisor"
    - "Lead"
    - "Volunteer"
    - "Commission"
    - "Intern"
    - "Junior"
  seniority_boost:
    - "Director"
    - "Head"
    - "VP"
    - "Chief of Staff"

search_queries:
  - name: Greenhouse - Atlanta Director Operations
    query: 'site:job-boards.greenhouse.io "Director of Operations" Atlanta'
    enabled: true
  - name: Greenhouse - Atlanta Chief of Staff
    query: 'site:job-boards.greenhouse.io "Chief of Staff" Atlanta'
    enabled: true
  - name: Ashby - Remote Integration
    query: 'site:jobs.ashbyhq.com "Director of Integration" OR "M&A Integration" remote'
    enabled: true
  - name: Lever - Remote Operations Director
    query: 'site:jobs.lever.co "Director of Operations" remote'
    enabled: false

tracked_companies:
  # Current applied / packaged roles retained for liveness and dedupe checks.
  - name: Tebra
    careers_url: https://job-boards.greenhouse.io/tebra
    api: https://boards-api.greenhouse.io/v1/boards/tebra/jobs
    notes: "Applied 2026-05-14: Chief of Staff."
    enabled: true

  - name: Alma
    careers_url: https://job-boards.greenhouse.io/alma
    api: https://boards-api.greenhouse.io/v1/boards/alma/jobs
    notes: "Applied 2026-05-14: Chief of Staff."
    enabled: true

  - name: Upwork
    careers_url: https://job-boards.greenhouse.io/upwork
    api: https://boards-api.greenhouse.io/v1/boards/upwork/jobs
    notes: "Package ready: Director, M&A Integration. Confirm GA eligibility."
    enabled: true

  - name: Rithum
    careers_url: https://job-boards.greenhouse.io/rithum
    api: https://boards-api.greenhouse.io/v1/boards/rithum/jobs
