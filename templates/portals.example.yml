# Example profile-local portal scanner configuration.
# Copy only when configuring Suitor manually; onboarding normally generates this.

location_filter:
  allow:
    - "Remote"
    - "United States"
  block: []

title_filter:
  positive:
    - "Product Manager"
    - "Operations"
  negative:
    - "Intern"
    - "Junior"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Director"

search_queries:
  - name: Example direct-board search
    query: 'site:job-boards.greenhouse.io "Product Manager" remote'
    enabled: false

tracked_companies:
  - name: Example Company
    careers_url: https://job-boards.greenhouse.io/example
    api: https://boards-api.greenhouse.io/v1/boards/example/jobs
    enabled: false

rss_feeds:
  - name: Example Feed
    url: https://example.com/jobs.xml
    limit: 10
    enabled: false
